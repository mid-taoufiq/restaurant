security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_MANAGER: [ROLE_WAITER, ROLE_KITCHEN]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/waiter, roles: ROLE_WAITER }
        - { path: ^/kitchen, roles: ROLE_KITCHEN }
        - { path: ^/dashboard, roles: ROLE_MANAGER }
        - { path: ^/backoffice, roles: ROLE_MANAGER }
